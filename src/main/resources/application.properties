spring.application.name=poo
server.port=${PORT:8080}


# =========================
# DATABASE
# =========================
spring.datasource.password=${JDBC_DATASOURCE_PASSWORD}
spring.datasource.username=${JDBC_DATASOURCE_USERNAME}
spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false




# =========================
# JWT
# =========================
jwt.secret=${JWT_SECRET:THIS_IS_A_LOCAL_DEV_SECRET_CHANGE_ME_123456789}


# =========================
# STRIPE (ENV VARS ONLY)
# =========================
stripe.secret.key=${STRIPE_SECRET_KEY:}
stripe.public.key=${STRIPE_PUBLIC_KEY:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}


spring.main.allow-bean-definition-overriding=true
